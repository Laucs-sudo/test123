# yt-archive.conf
# Override default settings here. This file is sourced by yt-archive.sh.
# Uncomment and edit the lines you want to change.

# Path to channels/playlist URL list (one URL per line)
# CHANNELS_FILE="/path/to/channels_to_download.txt"

# Path to the download archive tracker (records downloaded video IDs)
# ARCHIVE_FILE="/path/to/downloaded_videos.txt"

# Root download directory
# DOWNLOAD_DIR="/mnt/storage/youtube"

# Output filename template (yt-dlp format)
# OUTPUT_TEMPLATE='%(uploader)s [%(channel_id)s]/%(upload_date)s - %(title).64s - (%(duration)ss) [%(resolution)s] [%(id)s].%(ext)s'

# Container format (mkv or mp4)
# REMUX_FORMAT="mkv"

# Sleep intervals between downloads (seconds)
# MIN_SLEEP=1
# MAX_SLEEP=15

# Throttle rate (re-extract if speed drops below this)
# THROTTLE_RATE="100K"
